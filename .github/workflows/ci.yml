name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: foundation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d foundation_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/foundation_test
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the golden append-only check can read the base commit.
          fetch-depth: 0

      # Uses the version pinned in package.json "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # typecheck, lint, tests, and `pnpm content:validate` (content-cli on games/rpg/content).
      - run: pnpm check

      # Golden replay hashes are append-only per engine version: changing engine behaviour without bumping
      # ENGINE_VERSION (and appending new fixtures) fails here or in the golden test (ADR-0004, combat-engine §10).
      # Base: the PR base; on the default branch the previous push; on other branches the merge base with the default
      # branch (iterating on a version entry that is not integrated yet is allowed inside a branch).
      - name: golden fixtures are append-only
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -n "$PR_BASE" ]; then
            BASE="$PR_BASE"
          elif [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ]; then
            BASE="$BEFORE"
          else
            BASE="$(git merge-base "origin/$DEFAULT_BRANCH" HEAD || true)"
          fi
          node tools/golden/check-append-only.ts "$BASE" games/rpg/packages/rpg-sim/src/combat/golden.json
